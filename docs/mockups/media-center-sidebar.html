  const spotifyLogo = 'data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz48c3ZnIGlkPSJMYXllcl8xIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMzYuMDUgMjI1LjI1Ij48ZGVmcz48c3R5bGU+LmNscy0xe2ZpbGw6IzFlZDc2MDtzdHJva2Utd2lkdGg6MHB4O308L3N0eWxlPjwvZGVmcz48cGF0aCBjbGFzcz0iY2xzLTEiIGQ9Im0xMjIuMzcsMy4zMUM2MS45OS45MSwxMS4xLDQ3LjkxLDguNzEsMTA4LjI5Yy0yLjQsNjAuMzgsNDQuNjEsMTExLjI2LDEwNC45OCwxMTMuNjYsNjAuMzgsMi40LDExMS4yNi00NC42LDExMy42Ni0xMDQuOThDMjI5Ljc0LDU2LjU5LDE4Mi43NCw1LjcsMTIyLjM3LDMuMzFabTQ2LjE4LDE2MC4yOGMtMS4zNiwyLjQtNC4wMSwzLjYtNi41OSwzLjI0LS43OS0uMTEtMS41OC0uMzctMi4zMi0uNzktMTQuNDYtOC4yMy0zMC4yMi0xMy41OS00Ni44NC0xNS45My0xNi42Mi0yLjM0LTMzLjI1LTEuNTMtNDkuNDIsMi40LTMuNTEuODUtNy4wNC0xLjMtNy44OS00LjgxLS44NS0zLjUxLDEuMy03LjA0LDQuODEtNy44OSwxNy43OC00LjMyLDM2LjA2LTUuMjEsNTQuMzItMi42NCwxOC4yNiwyLjU3LDM1LjU4LDguNDYsNTEuNDksMTcuNTEsMy4xMywxLjc5LDQuMjMsNS43NywyLjQ1LDguOTFabTE0LjM4LTI4LjcyYy0yLjIzLDQuMTItNy4zOSw1LjY2LTExLjUxLDMuNDMtMTYuOTItOS4xNS0zNS4yNC0xNS4xNi01NC40NS0xNy44Ni0xOS4yMS0yLjctMzguNDctMS45Ny01Ny4yNiwyLjE2LTEuMDIuMjItMi4wMy4yNi0zLjAxLjEyLTMuNDEtLjQ4LTYuMzMtMy4wMi03LjExLTYuNTktMS4wMS00LjU4LDEuODktOS4xMSw2LjQ3LTEwLjEyLDIwLjc3LTQuNTcsNDIuMDYtNS4zOCw2My4yOC0yLjQsMjEuMjEsMi45OCw0MS40Niw5LjYyLDYwLjE2LDE5Ljc0LDQuMTMsMi4yMyw1LjY2LDcuMzgsMy40MywxMS41MVptMTUuOTQtMzIuMzhjLTIuMSw0LjA0LTYuNDcsNi4xMy0xMC43Myw1LjUzLTEuMTUtLjE2LTIuMjgtLjUyLTMuMzctMS4wOC0xOS43LTEwLjI1LTQwLjkyLTE3LjAyLTYzLjA3LTIwLjEzLTIyLjE1LTMuMTEtNDQuNDItMi40NS02Ni4xOCwxLjk3LTUuNjYsMS4xNS0xMS4xNy0yLjUxLTEyLjMyLTguMTYtMS4xNS01LjY2LDIuNTEtMTEuMTcsOC4xNi0xMi4zMiwyNC4xLTQuODksNDguNzQtNS42Miw3My4yNS0yLjE4LDI0LjUxLDMuNDQsNDcuOTksMTAuOTQsNjkuODEsMjIuMjksNS4xMiwyLjY2LDcuMTEsOC45Nyw0LjQ1LDE0LjA5WiIvPjwvc3ZnPg==';
  const games = [
    { id:'wuwa', name:'명조: 위더링 웨이브', letter:'명' },
    { id:'mongil', name:'몬길: STAR DIVE', letter:'몬' },
    { id:'hsr', name:'붕괴: 스타레일', letter:'붕' },
    { id:'hsrb', name:'붕괴: 스타레일(베타)', letter:'β' },
    { id:'gf2', name:'소녀전선2: 망명', letter:'소' },
    { id:'nikke', name:'승리의 여신: 니케', letter:'니' },
    { id:'zzz', name:'젠레스 존 제로', letter:'젠' }
  ];
  const tracks = [
    { title:'A Quiet Place', artist:'Lofi Study · Spotify' },
    { title:'오래된 숲을 지나 새벽의 바다로 걸어가는 사람들', artist:'고요한 밤의 플레이리스트 · Spotify' },
    { title:'Night Walk', artist:'Soft Piano · Spotify' }
  ];
  const defaults = { height:'900', scenario:'playing', longTitle:true, artwork:true, volume:65, auto:true, backgroundMute:true, autoFocus:true, track:0, gallery:'screenshot' };
  const state = { ...defaults, playing:true, hold:false, available:true, settings:false, running:[], muted:{}, spotifyMuted:false, adjusting:false };
  let volumeRevealTimer;
  function restore(saved) {
    if (!saved || saved.version !== 2) return;
    for (const key of ['height','scenario','longTitle','artwork','volume','auto','backgroundMute','autoFocus','gallery']) {
      if (typeof saved[key] === typeof defaults[key]) state[key] = saved[key];
    }
    if (!['760','900','1080'].includes(state.height)) state.height='900';
    if (!['empty','playing','paused','held'].includes(state.scenario)) state.scenario='playing';
    if (!['screenshot','recording'].includes(state.gallery)) state.gallery='screenshot';
    state.volume=Math.min(100,Math.max(0,Math.round(state.volume/5)*5));
  }
  restore(window.openai?.widgetState?.privateContent);
  const icon = name => '<i class="mc-icon" data-lucide="'+name+'" aria-hidden="true"></i>';
  const button = (name,label,action,classes='') => '<button type="button" class="mc-button cursor-interaction '+classes+'" data-action="'+action+'" aria-label="'+label+'" data-tooltip="'+label+'">'+icon(name)+'</button>';
  const stages = [...root.querySelectorAll('.mc-stage')];
  const gameRows = new Map();
  function icons() { if (globalThis.lucide) lucide.createIcons({ attrs:{ width:16,height:16 } }); }
  function save() {
    window.openai?.setWidgetState?.({
      modelContent:{ previewOnly:true, design:'enhanced-compact', scenario:state.scenario, height:state.height, albumArtwork:state.artwork, spotifyVolume:state.volume, autoBgm:state.auto, backgroundMute:state.backgroundMute, autoFocus:state.autoFocus },
      privateContent:{ version:2, height:state.height,scenario:state.scenario,longTitle:state.longTitle,artwork:state.artwork,volume:state.volume,auto:state.auto,backgroundMute:state.backgroundMute,autoFocus:state.autoFocus,gallery:state.gallery }
    }).catch(()=>{});
  }
  function applyScenario() {
    state.available = state.scenario!=='empty';
    state.playing = state.scenario==='playing';
    state.hold = state.scenario==='held';
  }
  function marquee(element,text) {
    element.replaceChildren();
    element.dataset.tooltip=text;
    element.setAttribute('aria-label',text);
    const track=document.createElement('span');track.className='mc-marquee-track';
    const primary=document.createElement('span');primary.textContent=text;track.append(primary);element.append(track);
    const overflow=primary.getBoundingClientRect().width>element.getBoundingClientRect().width;
    element.dataset.scroll=String(overflow);
    if(overflow) {
      const copy=document.createElement('span');copy.className='mc-marquee-copy';copy.textContent=text;copy.setAttribute('aria-hidden','true');track.append(copy);
      const distance=primary.getBoundingClientRect().width+parseFloat(getComputedStyle(copy).paddingLeft);
      element.style.setProperty('--mc-scroll-distance',distance+'px');
      element.style.setProperty('--mc-scroll-seconds',Math.max(12,distance/22)+'s');
    }
  }
  function renderVolume(stage) {
    const volume=stage.querySelector('[data-action="spotifyVolume"]');
    const silent=state.spotifyMuted||state.volume===0;
    volume.dataset.muted=String(silent);volume.dataset.adjusting=String(state.adjusting);
    volume.style.setProperty('--mc-angle',(state.volume*3.6)+'deg');
    volume.innerHTML=icon(silent?'volume-x':'volume-2')+'<span class="mc-volume-value" aria-hidden="true">'+state.volume+'%</span>';
    volume.setAttribute('aria-label','Spotify 음량 '+state.volume+'%, '+(silent?'음소거':'소리 켜짐'));
    volume.dataset.tooltip='Spotify · '+state.volume+'% · 휠로 5% 조절 · 클릭으로 음소거';
  }
  function adjustVolume(steps) {
    state.volume=Math.min(100,Math.max(0,state.volume+steps*5));state.adjusting=true;
    clearTimeout(volumeRevealTimer);for(const stage of stages)renderVolume(stage);icons();
    volumeRevealTimer=setTimeout(()=>{state.adjusting=false;for(const stage of stages)renderVolume(stage);icons();},900);
    save();
  }
  function renderGallery(stage) {
    const gallery=stage.querySelector('.mc-gallery');
    const rows=state.height==='760'?1:2;
    gallery.dataset.rows=String(rows);
    gallery.replaceChildren();
    const count=rows*3;
    for(let i=0;i<count;i++) {
      const tile=document.createElement('button');
      tile.type='button';tile.className='mc-button mc-thumb cursor-interaction';
      if(i===count-1) {
        tile.classList.add('mc-more');tile.innerHTML=icon('folder-open')+'<span>+'+(state.gallery==='screenshot'?693:12)+'</span>';
        tile.setAttribute('aria-label','더 많은 '+(state.gallery==='screenshot'?'스크린샷':'녹화')+' 보기');
      } else {
        tile.innerHTML=icon(state.gallery==='screenshot'?'image':'play');
        tile.setAttribute('aria-label',(state.gallery==='screenshot'?'스크린샷':'녹화')+' 미리보기 '+(i+1));
      }
      gallery.append(tile);
    }
  }
  function render() {
    const track=tracks[state.longTitle?1:state.track%tracks.length];
    for(const stage of stages) {
      const panel=stage.querySelector('.mc-panel');
      stage.style.minHeight=state.height+'px';panel.style.height=state.height+'px';panel.dataset.short=String(state.height==='760');
      marquee(stage.querySelector('.mc-track-title'),state.available?track.title:'Spotify 준비');
      marquee(stage.querySelector('.mc-artist'),state.available?track.artist:'아직 재생 중인 곡이 없어요');
      const cover=stage.querySelector('.mc-cover');
      cover.innerHTML=state.available&&state.artwork?'<span class="mc-cover-art" aria-hidden="true">QUIET<br>HOURS</span>':'<span class="mc-cover-fallback" aria-hidden="true"><img alt="" src="'+spotifyLogo+'"></span>';
      cover.setAttribute('aria-label',state.available&&state.artwork?'앨범 표지 예시':'Spotify 공식 아이콘 표시 영역');
      const play=stage.querySelector('[data-action="play"]');
      play.innerHTML=icon(state.playing?'pause':'play');play.setAttribute('aria-label',state.playing?'BGM 일시정지':state.available?'BGM 재생':'Spotify 열고 재생');play.dataset.tooltip=play.getAttribute('aria-label');
      stage.querySelector('[data-action="previous"]').disabled=!state.available;
      stage.querySelector('[data-action="next"]').disabled=!state.available;
      const auto=stage.querySelector('[data-action="auto"]');auto.setAttribute('aria-pressed',String(state.auto));auto.textContent=state.auto?'BGM 자동 켜짐':'BGM 자동 꺼짐';auto.dataset.tooltip='BGM 자동 재생만 '+(state.auto?'켜짐':'꺼짐')+'. 게임 음소거와 포커스는 별도 옵션이에요.';auto.setAttribute('aria-label','BGM 자동 재생 '+(state.auto?'켜짐':'꺼짐'));
      auto.dataset.tooltip=state.hold?'다른 미디어 우선 · 자동 재개하지 않아요. 재생 버튼으로 다시 시작할 수 있어요.':auto.dataset.tooltip;
      const progress=stage.querySelector('.mc-progress');progress.hidden=!state.available;
      progress.querySelector('.mc-progress-fill').style.width='38%';
      progress.querySelector('.mc-progress-track').setAttribute('aria-valuenow','38');
      renderVolume(stage);
      const settings=stage.querySelector('.mc-settings');settings.hidden=!state.settings;
      stage.querySelector('[data-action="settings"]').setAttribute('aria-expanded',String(state.settings));
      stage.querySelector('[data-option="backgroundMute"]').checked=state.backgroundMute;
      stage.querySelector('[data-option="autoFocus"]').checked=state.autoFocus;
      for(const tab of stage.querySelectorAll('[data-gallery]')) tab.setAttribute('aria-pressed',String(tab.dataset.gallery===state.gallery));
      for(const game of games) {
        const row=gameRows.get(stage).get(game.id), running=state.running.includes(game.id);
        row.dataset.running=String(running);
        const focus=row.querySelector('[data-action="focus"]');focus.style.visibility=running?'visible':'hidden';focus.disabled=!running;
        const main=row.querySelector('[data-action="game"]');main.innerHTML=icon(running?'power':'play');main.classList.toggle('mc-stop',running);main.setAttribute('aria-label',game.name+(running?' 종료':' 실행'));
        row.querySelector('.mc-game-name small').textContent=running?'실행 중':'';
        const volume=row.querySelector('[data-action="volume"]'),muted=!!state.muted[game.id];volume.dataset.muted=String(muted);volume.innerHTML=icon(muted?'volume-x':'volume-2');volume.setAttribute('aria-label',game.name+' 음소거 '+(muted?'해제':'설정'));
      }
      renderGallery(stage);
    }
    icons();
  }
  for(const stage of stages) {
    stage.append(document.getElementById('mc-enhanced-sidebar-template').content.cloneNode(true));
    const list=stage.querySelector('.mc-game-list'),rows=new Map();gameRows.set(stage,rows);
    for(const game of games) {
      const row=document.createElement('div');row.className='mc-game-row';row.dataset.game=game.id;
      row.innerHTML='<div class="mc-game-art" aria-label="'+game.name+' 임시 아이콘">'+game.letter+'</div><div class="mc-game-name" data-tooltip="'+game.name+'">'+game.name+'<small></small></div>'+button('focus','게임 창으로 이동','focus','mc-square')+button('play','게임 실행','game','mc-square')+'<button type="button" class="mc-volume cursor-interaction" data-action="volume" aria-label="게임 음소거">'+icon('volume-2')+'</button>';
      list.append(row);rows.set(game.id,row);
    }
    stage.addEventListener('click',event=>{
      const gallery=event.target.closest('[data-gallery]');
      if(gallery) { state.gallery=gallery.dataset.gallery;render();save();return; }
      const target=event.target.closest('[data-action]');if(!target)return;
      const action=target.dataset.action;
      if(action==='play') { state.available=true;state.playing=!state.playing;state.hold=false;state.scenario=state.playing?'playing':'paused'; }
      if(action==='previous'||action==='next') { state.track=(state.track+(action==='next'?1:tracks.length-1))%tracks.length;state.longTitle=false; }
      if(action==='auto') { state.auto=!state.auto;if(state.auto) { state.hold=false;state.playing=state.available;state.scenario=state.playing?'playing':'empty'; } }
      if(action==='spotifyVolume') state.spotifyMuted=!state.spotifyMuted;
      if(action==='settings') state.settings=!state.settings;
      if(action==='game') { const id=target.closest('[data-game]').dataset.game;state.running=state.running.includes(id)?state.running.filter(x=>x!==id):[...state.running,id]; }
      if(action==='volume') { const id=target.closest('[data-game]').dataset.game;state.muted[id]=!state.muted[id]; }
      render();save();
    });
    stage.addEventListener('change',event=>{
      const option=event.target.dataset.option;if(!['backgroundMute','autoFocus'].includes(option))return;
      state[option]=event.target.checked;render();save();
    });
    stage.addEventListener('wheel',event=>{if(!event.target.closest('[data-action="spotifyVolume"]'))return;event.preventDefault();adjustVolume(event.deltaY<0?1:-1);},{passive:false});
    stage.addEventListener('keydown',event=>{if(!event.target.closest('[data-action="spotifyVolume"]')||!['ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();adjustVolume(event.key==='ArrowUp'?1:-1);});
  }
  applyScenario();render();
  let lastWidth=root.getBoundingClientRect().width;
  const resizeObserver=new ResizeObserver(()=>{
    const width=root.getBoundingClientRect().width;
    if(width!==lastWidth) { lastWidth=width;render(); }
  });
  resizeObserver.observe(root);
  window.addEventListener('openai:set_globals',event=>{
    restore(event.detail?.globals?.widgetState?.privateContent);applyScenario();render();
  });
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>{applyScenario();render();save();}});
    tweak.addSelect(state,'height',{label:'가용 높이',options:[{label:'760 · 갤러리 한 행',value:'760'},{label:'900 · 갤러리 두 행',value:'900'},{label:'1080 · 갤러리 두 행',value:'1080'}]});
    tweak.addSelect(state,'scenario',{label:'미디어 상태',options:[{label:'Spotify 준비 전',value:'empty'},{label:'BGM 재생 중',value:'playing'},{label:'사용자 일시정지',value:'paused'},{label:'다른 미디어 우선',value:'held'}]});
    tweak.addToggle(state,'longTitle',{label:'긴 곡명'});
    tweak.addToggle(state,'artwork',{label:'앨범 표지'});
    tweak.addSlider(state,'volume',{label:'Spotify 음량',min:0,max:100,step:5,unit:'%'});
  }
})();
